name: Code Quality

permissions:
  contents: read

on:
  push:
    branches: [ master, main, dev, develop ]
  pull_request:
    branches: [ master, main ]
  schedule:
    # Run weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'

jobs:
  luacheck:
    name: Lua Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Lua and luacheck
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.1 luarocks
        sudo luarocks install luacheck

    - name: Use repository luacheck config
      run: |
        echo "Using existing .luacheckrc from repository"
        cat .luacheckrc

    - name: Run luacheck with repository config
      run: |
        echo "Running luacheck with .luacheckrc configuration..."
        luacheck --no-color --codes ChatCompat.lua Name2Chat.lua

        if [ -d "lang" ]; then
          echo "Checking locale files..."
          luacheck --no-color --codes lang/*.lua || true
        fi

    - name: Generate code quality report
      run: |
        echo "## 🔍 Code Quality Report" >> $GITHUB_STEP_SUMMARY
        echo "### Luacheck Results" >> $GITHUB_STEP_SUMMARY

        # Run luacheck and capture output
        if luacheck --no-color --formatter=plain ChatCompat.lua Name2Chat.lua > luacheck_output.txt 2>&1; then
          echo "✅ **No issues found in main files**" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Issues found in main files:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat luacheck_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

        if [ -d "lang" ]; then
          if luacheck --no-color --formatter=plain lang/*.lua > luacheck_locale.txt 2>&1; then
            echo "✅ **No issues found in locale files**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Issues found in locale files:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat luacheck_locale.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
        fi

  toc-validation:
    name: TOC File Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Validate TOC structure
      run: |
        echo "Validating TOC file structure..."

        # Check if TOC file exists
        if [ ! -f "Name2Chat.toc" ]; then
          echo "❌ TOC file not found!"
          exit 1
        fi

        echo "✅ TOC file found"

        # Extract and validate required fields
        INTERFACE=$(grep "^## Interface:" Name2Chat.toc | head -1 | cut -d':' -f2- | sed 's/^[[:space:]]*//')
        TITLE=$(grep "^## Title:" Name2Chat.toc | cut -d' ' -f3-)
        VERSION=$(grep "^## Version:" Name2Chat.toc | cut -d' ' -f3 | tr -d '\r\n ')
        AUTHOR=$(grep "^## Author:" Name2Chat.toc | cut -d' ' -f3-)

        echo "Found TOC fields:"
        echo "  Interface: $INTERFACE"
        echo "  Title: $TITLE"
        echo "  Version: $VERSION"
        echo "  Author: $AUTHOR"

        # Validate version format (allow X.Y.Z or @project-version@ placeholder)
        if [[ "$VERSION" == "@project-version@" ]] || [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          echo "✅ Version format is valid: $VERSION"
        else
          echo "⚠️ Version format should be X.Y.Z or @project-version@, found: $VERSION"
        fi

        # Check for required files mentioned in TOC
        echo "Checking file references..."
        while IFS= read -r line; do
          # Skip comments and empty lines
          if [[ $line =~ ^[[:space:]]*# ]] || [[ -z "${line// }" ]]; then
            continue
          fi

          # Remove carriage returns and trim whitespace
          filename=$(echo "$line" | tr -d '\r' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
          if [ -n "$filename" ]; then
            if [ -f "$filename" ]; then
              echo "✅ File found: $filename"
            else
              echo "❌ File not found: $filename"
              exit 1
            fi
          fi
        done < Name2Chat.toc

    - name: Generate TOC validation report
      run: |
        echo "## 📋 TOC Validation Report" >> $GITHUB_STEP_SUMMARY

        VERSION=$(grep "^## Version:" Name2Chat.toc | cut -d' ' -f3 | tr -d '\r\n ')
        INTERFACE=$(grep "^## Interface:" Name2Chat.toc | head -1 | cut -d':' -f2- | sed 's/^[[:space:]]*//')

        echo "### Current Version Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
        echo "- **Main Interface(s):** $INTERFACE" >> $GITHUB_STEP_SUMMARY

        echo "### Interface Compatibility" >> $GITHUB_STEP_SUMMARY
        echo "| Version | Interface | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|-----------|--------|" >> $GITHUB_STEP_SUMMARY

        # Check each interface version
        for variant in "Retail" "Mists" "Cata" "Wrath" "TBC" "BCC" "Forever" "Classic"; do
          interface_line=$(grep "^## Interface-$variant:" Name2Chat.toc || echo "")
          if [ -n "$interface_line" ]; then
            interface_version=$(echo "$interface_line" | cut -d':' -f2- | tr -d '\r\n' | sed 's/^[[:space:]]*//')
            echo "| $variant | $interface_version | ✅ Supported |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| $variant | - | ❌ Not specified |" >> $GITHUB_STEP_SUMMARY
          fi
        done

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Scan for sensitive patterns
      run: |
        echo "Scanning for potential security issues..."

        # Check for common security anti-patterns in Lua/WoW addons
        echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY

        security_issues=0

        # Check for potentially dangerous functions
        dangerous_patterns=(
          "RunScript"
          "loadstring"
          "dofile"
          "getfenv"
          "setfenv"
        )

        for pattern in "${dangerous_patterns[@]}"; do
          if grep -rn "\b$pattern\b" *.lua lang/*.lua 2>/dev/null; then
            echo "⚠️ Found potentially dangerous function: $pattern" >> $GITHUB_STEP_SUMMARY
            security_issues=$((security_issues + 1))
          fi
        done

        # Check for hardcoded secrets/tokens
        secret_patterns=(
          "password[[:space:]]*="
          "token[[:space:]]*="
          "api_key[[:space:]]*="
          "secret[[:space:]]*="
        )

        for pattern in "${secret_patterns[@]}"; do
          if grep -rni "$pattern" *.lua lang/*.lua 2>/dev/null; then
            echo "⚠️ Potential hardcoded secret found: $pattern" >> $GITHUB_STEP_SUMMARY
            security_issues=$((security_issues + 1))
          fi
        done

        if [ $security_issues -eq 0 ]; then
          echo "✅ **No security issues detected**" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **$security_issues potential security issues found**" >> $GITHUB_STEP_SUMMARY
        fi

  addon-metadata:
    name: Addon Metadata Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Extract and validate metadata
      run: |
        echo "## 📊 Addon Metadata" >> $GITHUB_STEP_SUMMARY

        # Extract metadata from TOC
        TITLE=$(grep "^## Title:" Name2Chat.toc | cut -d' ' -f3-)
        NOTES=$(grep "^## Notes:" Name2Chat.toc | cut -d' ' -f3-)
        AUTHOR=$(grep "^## Author:" Name2Chat.toc | cut -d' ' -f3-)
        VERSION=$(grep "^## Version:" Name2Chat.toc | cut -d' ' -f3)
        WEBSITE=$(grep "^## X-Website:" Name2Chat.toc | cut -d' ' -f3-)
        CURSE_ID=$(grep "^## X-Curse-Project-ID:" Name2Chat.toc | cut -d' ' -f3)
        WOWI_ID=$(grep "^## X-WoWI-ID:" Name2Chat.toc | cut -d' ' -f3)
        WAGO_ID=$(grep "^## X-Wago-ID:" Name2Chat.toc | cut -d' ' -f3)

        echo "### Basic Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Title:** $TITLE" >> $GITHUB_STEP_SUMMARY
        echo "- **Description:** $NOTES" >> $GITHUB_STEP_SUMMARY
        echo "- **Author:** $AUTHOR" >> $GITHUB_STEP_SUMMARY
        echo "- **Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
        echo "- **Website:** $WEBSITE" >> $GITHUB_STEP_SUMMARY

        echo "### Platform Integration" >> $GITHUB_STEP_SUMMARY
        echo "| Platform | ID | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| CurseForge | $CURSE_ID | $([ -n "$CURSE_ID" ] && echo "✅ Configured" || echo "❌ Missing") |" >> $GITHUB_STEP_SUMMARY
        echo "| WoWInterface | $WOWI_ID | $([ -n "$WOWI_ID" ] && echo "✅ Configured" || echo "❌ Missing") |" >> $GITHUB_STEP_SUMMARY
        echo "| Wago | $WAGO_ID | $([ -n "$WAGO_ID" ] && echo "✅ Configured" || echo "❌ Missing") |" >> $GITHUB_STEP_SUMMARY

        # Check for missing locale files
        echo "### Localization Status" >> $GITHUB_STEP_SUMMARY
        if [ -d "lang" ]; then
          locale_count=$(find lang -name "*.lua" | wc -l)
          echo "- **Locale files:** $locale_count found" >> $GITHUB_STEP_SUMMARY
          echo "- **Languages:** $(find lang -name "*.lua" | sed 's|lang/||' | sed 's|\.lua||' | sort | tr '\n' ', ' | sed 's|, $||')" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Locale files:** None found" >> $GITHUB_STEP_SUMMARY
        fi
